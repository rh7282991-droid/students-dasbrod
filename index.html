    const copyToClipboardSafe = (text) => {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text);
          return true;
        }
      } catch (e) {}
      try {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        textArea.style.left = "-9999px";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        document.execCommand('copy');
        document.body.removeChild(textArea);
        return true;
      } catch (err) {
        return false;
      }
    };

    // Multi-layer persistent storage (localStorage + Cookie + window.name + IndexedDB)
    // Ensures credentials survive page refreshes even inside strict iframe sandboxes
    const PersistentStore = {
      save(key, data) {
        const json = JSON.stringify(data);
        try { window.localStorage.setItem(key, json); } catch (e) {}
        try { window.sessionStorage.setItem(key, json); } catch (e) {}
        try {
          const encoded = encodeURIComponent(btoa(unescape(encodeURIComponent(json))));
          document.cookie = `${key}=${encoded}; path=/; max-age=31536000; SameSite=Lax`;
        } catch (e) {}
        try {
          let wn = {};
          try { wn = JSON.parse(window.name || '{}'); } catch (e) {}
          wn[key] = data;
          window.name = JSON.stringify(wn);
        } catch (e) {}
        try {
          if (window.indexedDB) {
            const req = window.indexedDB.open('ActiveTutorsConfigDB', 1);
            req.onupgradeneeded = (ev) => {
              const db = ev.target.result;
              if (!db.objectStoreNames.contains('configs')) {
                db.createObjectStore('configs');
              }
            };
            req.onsuccess = (ev) => {
              const db = ev.target.result;
              const tx = db.transaction('configs', 'readwrite');
              tx.objectStore('configs').put(data, key);
            };
          }
        } catch (e) {}
      },
      loadSync(key) {
        try {
          const ls = window.localStorage.getItem(key);
          if (ls) return JSON.parse(ls);
        } catch (e) {}
        try {
          const ss = window.sessionStorage.getItem(key);
          if (ss) return JSON.parse(ss);
        } catch (e) {}
        try {
          const match = document.cookie.match(new RegExp('(^| )' + key + '=([^;]+)'));
          if (match && match[2]) {
            const decoded = decodeURIComponent(escape(atob(decodeURIComponent(match[2]))));
            return JSON.parse(decoded);
          }
        } catch (e) {}
        try {
          if (window.name) {
            const wn = JSON.parse(window.name);
            if (wn && wn[key]) return wn[key];
          }
        } catch (e) {}
        return null;
      },
      loadAsyncIDB(key) {
        return new Promise((resolve) => {
          try {
            if (!window.indexedDB) return resolve(null);
            const req = window.indexedDB.open('ActiveTutorsConfigDB', 1);
            req.onupgradeneeded = (ev) => {
              const db = ev.target.result;
              if (!db.objectStoreNames.contains('configs')) {
                db.createObjectStore('configs');
              }
            };
            req.onsuccess = (ev) => {
              const db = ev.target.result;
              const tx = db.transaction('configs', 'readonly');
              const getReq = tx.objectStore('configs').get(key);
              getReq.onsuccess = () => resolve(getReq.result || null);
              getReq.onerror = () => resolve(null);
            };
            req.onerror = () => resolve(null);
          } catch (e) {
            resolve(null);
          }
        });
      },
      clear(key) {
        try { window.localStorage.removeItem(key); } catch (e) {}
        try { window.sessionStorage.removeItem(key); } catch (e) {}
        try { document.cookie = `${key}=; path=/; max-age=0`; } catch (e) {}
        try {
          let wn = {};
          try { wn = JSON.parse(window.name || '{}'); } catch (e) {}
          delete wn[key];
          window.name = JSON.stringify(wn);
        } catch (e) {}
        try {
          if (window.indexedDB) {
            const req = window.indexedDB.open('ActiveTutorsConfigDB', 1);
            req.onsuccess = (ev) => {
              const db = ev.target.result;
              if (db.objectStoreNames.contains('configs')) {
                const tx = db.transaction('configs', 'readwrite');
                tx.objectStore('configs').delete(key);
              }
            };
          }
        } catch (e) {}
      }
    };

      if (Array.isArray(val)) return val;
      if (typeof val === 'string' && val.trim().length > 0) {
        return val.split(/[,;|\n]+/).map(s => s.trim()).filter(Boolean);
      }
      return [];

      const [finalizedTuitions, setFinalizedTuitions] = useState(INITIAL_FINALIZED_TUITIONS);

      // Dynamic Supabase Client helper (only initializes on valid http/https URL)
      const getSupabaseClient = useCallback((url = supabaseConfig.url, key = supabaseConfig.anonKey) => {
        const cleanUrl = (url || '').trim();
        const cleanKey = (key || '').trim();
        if (!cleanUrl.startsWith('http://') && !cleanUrl.startsWith('https://')) return null;
        if (!cleanKey || !window.supabase) return null;
        try {
          return window.supabase.createClient(cleanUrl, cleanKey);
        } catch (err) {

      }, [supabaseConfig.url, supabaseConfig.anonKey]);

      // Normalize Tutor Row from Supabase safely
      const normalizeTutorRow = (row) => ({
        id: row.id ?? Date.now() + Math.random(),
        name: row.name || 'Unnamed Tutor',
        avatar: row.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(row.name || 'Tutor')}&background=random&color=fff&size=200&bold=true`,
        university: row.university || 'University of Dhaka (DU)',
        department: row.department || 'General',
        yearSemester: row.yearSemester || row.year_semester || '3rd Year',
        cgpa: row.cgpa || 'N/A',
        phone: row.phone || '+880 1700-000000',
        email: row.email || '',
        classes: ensureArray(row.classes),
        subjects: ensureArray(row.subjects),
        preferredAreas: ensureArray(row.preferredAreas ?? row.preferred_areas),
        expectedSalary: Number(row.expectedSalary ?? row.expected_salary ?? 7000),
        availability: row.availability || 'Negotiable',
        tuitionType: row.tuitionType || row.tuition_type || 'Home',
        rating: Number(row.rating ?? 5.0),
        reviews: Number(row.reviews ?? 0),
        college: row.college || '',

        presentAddress: row.presentAddress || row.present_address || 'Dhaka',

      // Helper: Auto-add leading '0' if missing (e.g. 1712... -> 01712...) and format for WaSender (8801712...)
      const formatBdPhoneNumbers = (rawPhone) => {
        if (!rawPhone) return { localWithZero: '01700000000', waNumber: '8801700000000', display: '01700-000000' };
        let digits = String(rawPhone).replace(/[^\d]/g, '');

        // Remove leading 880 or 88 if present to normalize core digits
        if (digits.startsWith('880')) {
          digits = digits.slice(3);
        } else if (digits.startsWith('88') && digits.length > 11) {
          digits = digits.slice(2);
        }

        // If 10 digits starting with 1 (missing leading 0, e.g., 1712345678), automatically prepend '0'
        if (digits.length === 10 && digits.startsWith('1')) {
          digits = '0' + digits;
        } else if (!digits.startsWith('0') && digits.length > 0) {
          digits = '0' + digits;
        }

        const localWithZero = digits; // e.g., 01712345678
        const waNumber = '88' + localWithZero; // e.g., 8801712345678 (WaSender format)
        const display = localWithZero.length === 11
          ? `${localWithZero.slice(0, 5)}-${localWithZero.slice(5)}`
          : localWithZero;

        return { localWithZero, waNumber, display };

        const localNumbers = formattedList.map((f) => f.localWithZero);

          return;

        setIsSendingWa(true);
        try {

              phone: waNumbers[i],
              to: waNumbers[i],
              local_number: localNumbers[i],
              message: messageText,
              text: messageText,
              api_key: waSenderApiKey.trim(),
              key: waSenderApiKey.trim(),

      const matchedTutors = useMemo(() => {
        return tutorList
          .map((tutor) => {
            let score = 55; // Base Initial Score
            const tutorClasses = ensureArray(tutor.classes);
            const tutorSubjects = ensureArray(tutor.subjects);
            const tutorAreas = ensureArray(tutor.preferredAreas);

            // 1. Class / Grade Matching
            if (appliedFilters.className !== 'All Classes') {
              const filterClass = appliedFilters.className.toLowerCase();
              const teachesClass = tutorClasses.some(c => 
                c.toLowerCase().includes(filterClass) || filterClass.includes(c.toLowerCase())
              );
              
              if (teachesClass) {
                score += 20;
              } else {
                score -= 25;
              }
            }

            // 2. Subjects Matching
            if (appliedFilters.subjects.length > 0) {
              const tutorSubsLower = tutorSubjects.map(s => s.toLowerCase());
              const filterSubs = appliedFilters.subjects.map(s => s.toLowerCase());
              
              const matchedSubs = filterSubs.filter(fs => 
                tutorSubsLower.some(ts => ts.includes(fs) || fs.includes(ts))
              );
              
              if (matchedSubs.length > 0) {
                const subRatio = matchedSubs.length / filterSubs.length;
                score += Math.round(subRatio * 25);
              } else {
                score -= 35;
              }
            }

            // 3. Location Matching (Robust Fuzzy Match)
            if (appliedFilters.locations && appliedFilters.locations.length > 0) {
              const tutorAreasLower = tutorAreas.map((a) => a.trim().toLowerCase()).filter(Boolean);

              let hasDirectMatch = false;
              let hasPuranDhakaBroadMatch = false;

              appliedFilters.locations.forEach((filterLoc) => {
                const fLower = filterLoc.toLowerCase();
                const isPuranDhakaFilter = fLower.includes('puran dhaka') || fLower.includes('পুরান ঢাকা');
                const puranDhakaKeywords = [
                  'bangshal', 'nazira', 'nazimuddin', 'urdu', 'lalbagh', 'hosnidalan',
                  'chankharpool', 'armanitola', 'nayabazar', 'islampur', 'wari', 'azimpur',
                  'kamrangirchar', 'chawkbazar', 'sadarghat', 'laxmibazar'
                ];

                tutorAreasLower.forEach((tArea) => {
                  if (
                    tArea.includes(fLower) || fLower.includes(tArea) ||
                    (fLower.includes('nazira') && tArea.includes('nazira')) ||
                    (fLower.includes('shukrabad') && tArea.includes('shukrabad')) ||
                    (fLower.includes('kodomtoli') && tArea.includes('kodomtoli')) ||
                    (fLower.includes('hosni') && tArea.includes('hosni')) ||
                    (fLower.includes('chankhar') && tArea.includes('chankhar'))
                  ) {
                    hasDirectMatch = true;
                  }

                  if (isPuranDhakaFilter && puranDhakaKeywords.some((pk) => tArea.includes(pk))) {
                    hasPuranDhakaBroadMatch = true;
                  }
                });
              });

              if (hasDirectMatch) {
                score += 25;
              } else if (hasPuranDhakaBroadMatch) {
                score += 15;
              } else {
                score -= 35;
              }
            }

            // 4. University & Department Preferences
            if (appliedFilters.university !== 'All Universities') {
              if (tutor.university === appliedFilters.university) {
                score += 15;
              } else {
                score -= 5;
              }
            }

            if (appliedFilters.department !== 'All Departments') {
              if (tutor.department === appliedFilters.department) {
                score += 10;
              }
            }

            // 5. Budget Verification
            if (appliedFilters.budgetCap > 0) {
              if (tutor.expectedSalary <= appliedFilters.budgetCap) {
                score += 10;
              } else if (tutor.expectedSalary <= appliedFilters.budgetCap + 2000) {
                score += 3;
              } else {
                score -= 15;
              }
            }

            // 6. Global Search
            if (globalSearch.trim()) {
              const q = globalSearch.toLowerCase();
              const matchQuery =
                (tutor.name || '').toLowerCase().includes(q) ||
                (tutor.university || '').toLowerCase().includes(q) ||
                (tutor.department || '').toLowerCase().includes(q) ||
                (tutor.phone || '').includes(q) ||
                tutorSubjects.some(s => s.toLowerCase().includes(q)) ||
                tutorAreas.some(a => a.toLowerCase().includes(q));
                
              if (!matchQuery) return null;
            }

            if (score < 25) {
              return null;
            }

            const normalizedScore = Math.min(Math.max(score, 10), 99);
            
            return {
              ...tutor,
              classes: tutorClasses,
              subjects: tutorSubjects,
              preferredAreas: tutorAreas,
              matchScore: normalizedScore
            };
          })
          .filter(Boolean)
          .sort((a, b) => b.matchScore - a.matchScore);

                    </div>
                    <div>
                      <h3 className="font-bold text-base">Manually Add Guardian Request</h3>
                      <p className="text-xs text-slate-400">
                        নতুন টিউশন রিকোয়ারমেন্ট লগ করুন
                      </p>
                    </div>
                  </div>
                  <button
                    onClick={() => {
                      setAddRequestModalOpen(false);
                      setNewRequestForm(initialNewRequestForm);
                    }}
                    className="p-1 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-white transition"
                  >
                    <Icon name="x" size={18} />
                  </button>
                </div>

                <div className="p-5 space-y-4 text-xs overflow-y-auto flex-1">
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Student Name *</label>
                      <input
                        type="text"
                        value={newRequestForm.studentName}
                        onChange={(e) => setNewRequestForm({ ...newRequestForm, studentName: e.target.value })}
                        className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none"
                        placeholder="e.g. Rakib Hasan"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Guardian Name</label>
                      <input
                        type="text"
                        value={newRequestForm.guardianName}
                        onChange={(e) => setNewRequestForm({ ...newRequestForm, guardianName: e.target.value })}
                        className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none"
                        placeholder="e.g. Mr. Hasan"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Guardian Phone *</label>
                      <input
                        type="text"
                        value={newRequestForm.guardianPhone}
                        onChange={(e) => setNewRequestForm({ ...newRequestForm, guardianPhone: e.target.value })}
                        className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none"
                        placeholder="e.g. +880 1..."
                      />
                    </div>
                     <div>
                      <label className="block font-bold text-slate-700 mb-1">Salary Range</label>
                      <input
                        type="text"
                        value={newRequestForm.salaryRange}
                        onChange={(e) => setNewRequestForm({ ...newRequestForm, salaryRange: e.target.value })}
                        className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none"
                        placeholder="e.g. BDT 5,000 - 7,000"
                      />
                    </div>

                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Class / Grade</label>
                      <select
                        value={newRequestForm.className}
                        onChange={(e) => setNewRequestForm({ ...newRequestForm, className: e.target.value })}
                        className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none"
                      >
                        {CLASSES_LIST.map((c) => (
                          <option key={c} value={c}>{c}</option>
                        ))}
                      </select>
                    </div>
                    
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Location / Area</label>
                       <select
                        value={newRequestForm.tuitionArea}
                        onChange={(e) => setNewRequestForm({ ...newRequestForm, tuitionArea: e.target.value })}
                        className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none"
                      >
                         {LOCATIONS.map((l) => (
                          <option key={l} value={l}>{l}</option>
                        ))}
                      </select>
                    </div>

                    <div className="md:col-span-2">
                      <label className="block font-bold text-slate-700 mb-1">Subjects Needed</label>
                      <select
                        onChange={(e) => {
                          const val = e.target.value;
                          if (val && !newRequestForm.subjects.includes(val)) {
                            setNewRequestForm({ ...newRequestForm, subjects: [...newRequestForm.subjects, val] });
                          }
                          e.target.value = '';
                        }}
                        className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none"
                        defaultValue=""
                      >
                        <option value="" disabled>+ Add Subject</option>
                        {SUBJECTS_LIST.map((s) => (
                          <option key={s} value={s} disabled={newRequestForm.subjects.includes(s)}>{s}</option>
                        ))}
                      </select>
                      <div className="flex flex-wrap gap-1 mt-2">
                        {newRequestForm.subjects.map((s) => (
                          <span key={s} className="inline-flex items-center gap-1 px-2 py-0.5 bg-indigo-50 border border-indigo-200 text-indigo-800 rounded-lg text-[11px] font-semibold">
                            {s}
                            <button onClick={() => setNewRequestForm({ ...newRequestForm, subjects: newRequestForm.subjects.filter(item => item !== s) })} className="hover:text-rose-600 ml-0.5">&times;</button>
                          </span>
                        ))}
                      </div>
                    </div>

                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Tutor Gender Pref.</label>
                      <select
                        value={newRequestForm.preferredGender}
                        onChange={(e) => setNewRequestForm({ ...newRequestForm, preferredGender: e.target.value })}
                        className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none"
                      >
                        <option value="Any">Any</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                      </select>
                    </div>

                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Tutor Varsity Pref.</label>
                      <select
                        value={newRequestForm.preferredUniversity}
                        onChange={(e) => setNewRequestForm({ ...newRequestForm, preferredUniversity: e.target.value })}
                        className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none"
                      >
                        {UNIVERSITIES.map((u) => (
                          <option key={u} value={u}>{u}</option>
                        ))}
                      </select>
                    </div>

                    <div className="md:col-span-2">
                       <label className="block font-bold text-slate-700 mb-1">Special Notes / Requirements</label>
                       <textarea
                        rows={2}
                        value={newRequestForm.note}
                        onChange={(e) => setNewRequestForm({ ...newRequestForm, note: e.target.value })}
                        className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none"
                        placeholder="e.g. English version student..."
                       />
                    </div>
                  </div>
                </div>

                <div className="p-4 border-t border-slate-100 bg-slate-50 flex items-center justify-between flex-shrink-0">
                  <button
                    type="button"
                    onClick={() => {
                      setAddRequestModalOpen(false);
                      setNewRequestForm(initialNewRequestForm);
                    }}
                    className="px-4 py-2 text-xs font-semibold text-slate-600 hover:text-slate-800"
                  >
                    Cancel
                  </button>

                  <button
                    type="button"
                    onClick={handleManualAddRequest}
                    className="px-5 py-2 text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow-md flex items-center gap-1.5 transition"
                  >
                    <Icon name="check" size={14} />
                    <span>Save Request</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MANUAL ADD PAYMENT RECORD MODAL */}
          {addPaymentModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] shadow-2xl border border-slate-200 overflow-hidden flex flex-col">
                <div className="p-5 border-b border-slate-100 flex items-center justify-between bg-emerald-700 text-white flex-shrink-0">
                  <div className="flex items-center gap-3">
                    <div className="h-10 w-10 rounded-full bg-white/20 text-white flex items-center justify-center">
                      <Icon name="creditCard" size={18} />
                    </div>
                    <div>
                      <h3 className="font-bold text-base">Manually Add Payment Ledger Record</h3>
                      <p className="text-xs text-emerald-100">
                        চূড়ান্ত হওয়া টিউশনের পেমেন্ট রেকর্ড যুক্ত করুন
                      </p>
                    </div>
                  </div>
                  <button
                    onClick={() => {
                      setAddPaymentModalOpen(false);
                      setNewPaymentForm(initialNewPaymentForm);
                    }}
                    className="p-1 rounded-lg hover:bg-white/20 text-white transition"
                  >
                    <Icon name="x" size={18} />
                  </button>
                </div>

                <div className="p-5 space-y-4 text-xs overflow-y-auto flex-1">
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Tuition Code *</label>
                      <input
                        type="text"
                        value={newPaymentForm.code}
                        onChange={(e) => setNewPaymentForm({ ...newPaymentForm, code: e.target.value })}
                        className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none font-mono uppercase"
                        placeholder="e.g. AT3001"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Joining Date</label>
                      <input
                        type="text"
                        value={newPaymentForm.joiningDate}
                        onChange={(e) => setNewPaymentForm({ ...newPaymentForm, joiningDate: e.target.value })}
                        className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none"
                        placeholder="e.g. 10 Oct 2026"
                      />
                    </div>

                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Tutor Name *</label>
                      <input
                        type="text"
                        value={newPaymentForm.tutorName}
                        onChange={(e) => setNewPaymentForm({ ...newPaymentForm, tutorName: e.target.value })}
                        className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none"
                        placeholder="e.g. Rakib Hasan"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Tutor Phone</label>
                      <input
                        type="text"
                        value={newPaymentForm.tutorPhone}
                        onChange={(e) => setNewPaymentForm({ ...newPaymentForm, tutorPhone: e.target.value })}
                        className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none"
                        placeholder="e.g. +880 1..."
                      />
                    </div>

                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Student Name *</label>
                       <input
                        type="text"
                        value={newPaymentForm.studentName}
                        onChange={(e) => setNewPaymentForm({ ...newPaymentForm, studentName: e.target.value })}
                        className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none"
                        placeholder="e.g. Abrar Kabir"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Tuition Area</label>
                       <select
                        value={newPaymentForm.tuitionArea}
                        onChange={(e) => setNewPaymentForm({ ...newPaymentForm, tuitionArea: e.target.value })}
                        className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none"
                      >
                         {LOCATIONS.map((l) => (
                          <option key={l} value={l}>{l}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Monthly Fee (Total Due)</label>
                      <input
                        type="number"
                        value={newPaymentForm.monthlyFee}
                        onChange={(e) => setNewPaymentForm({ ...newPaymentForm, monthlyFee: e.target.value })}
                        className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none"
                        placeholder="e.g. 8000"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Paid Amount</label>
                      <input
                        type="number"
                        value={newPaymentForm.paidAmount}
                        onChange={(e) => setNewPaymentForm({ ...newPaymentForm, paidAmount: e.target.value })}
                        className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none"
                        placeholder="e.g. 4000"
                      />
                    </div>
                  </div>
                </div>

                <div className="p-4 border-t border-slate-100 bg-slate-50 flex items-center justify-between flex-shrink-0">
                  <button
                    type="button"
                    onClick={() => {
                      setAddPaymentModalOpen(false);
                      setNewPaymentForm(initialNewPaymentForm);
                    }}
                    className="px-4 py-2 text-xs font-semibold text-slate-600 hover:text-slate-800"
                  >
                    Cancel
                  </button>

                  <button
                    type="button"
                    onClick={handleManualAddPayment}
                    className="px-5 py-2 text-xs font-bold text-white bg-emerald-600 hover:bg-emerald-700 rounded-xl shadow-md flex items-center gap-1.5 transition"
                  >
                    <Icon name="check" size={14} />
                    <span>Save Payment Record</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* TOAST POPUP NOTIFICATION */}
          {toastMessage && (
            <div className="fixed bottom-5 right-5 z-50 bg-slate-900 text-white px-4 py-3 rounded-2xl shadow-2xl border border-slate-700 flex items-center gap-2 text-xs font-bold animate-bounce">
              <Icon name="checkCircle" size={15} className="text-emerald-400" />
              <span>{toastMessage}</span>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
